
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Version 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Portfolio</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home">
        <h2>Welcome to My Portfolio</h2>
        <p>Hello! I am a Computer Science student.</p>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <p>I am interested in software development
        and technology.</p>
    </section>

    <section id="projects">
        <h2>My Projects</h2>

        <div>
            <h3>Portfolio Website</h3>
            <p>My personal portfolio project.</p>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>

        <form id="contactForm">
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <p>Copyright 2026 My Portfolio</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
